<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opp.ai — AI Opportunity Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Header Navbar -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-indigo-500/30">
                    O
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                        Opp.ai
                    </h1>
                    <p class="text-xs text-slate-400">AI Opportunity Matching & Extraction Agent</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                    AI Engine Ready
                </span>
                <a href="http://localhost:8000/docs" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                    Swagger API Docs ↗
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        
        <!-- Student Persona Selector -->
        <section class="bg-slate-800/50 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-indigo-400 mb-4">
                1. Select Student Persona (Simulate Student Profile)
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="persona-grid">
                <!-- Alex Chen -->
                <button onclick="selectPersona('std_101')" id="btn-std_101" class="persona-btn text-left p-4 rounded-xl border border-indigo-500/50 bg-indigo-500/10 hover:bg-indigo-500/20 transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-white group-hover:text-indigo-300">Alex Chen</span>
                        <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-mono">B.S. CS</span>
                    </div>
                    <div class="text-xs text-slate-400 space-y-1">
                        <p><strong>GPA:</strong> 3.85 | <strong>Grad:</strong> 2027</p>
                        <p><strong>Skills:</strong> Python, PyTorch, React, FastAPI</p>
                        <p><strong>Interests:</strong> AI/ML, Web Dev, Hackathons</p>
                    </div>
                </button>

                <!-- Maya Patel -->
                <button onclick="selectPersona('std_102')" id="btn-std_102" class="persona-btn text-left p-4 rounded-xl border border-slate-700/60 bg-slate-800/40 hover:bg-slate-800 transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-white group-hover:text-indigo-300">Maya Patel</span>
                        <span class="text-xs bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded font-mono">B.S. ECE</span>
                    </div>
                    <div class="text-xs text-slate-400 space-y-1">
                        <p><strong>GPA:</strong> 3.40 | <strong>Grad:</strong> 2026</p>
                        <p><strong>Skills:</strong> C++, Linux, ROS, Embedded</p>
                        <p><strong>Interests:</strong> Robotics, Systems, Cloud</p>
                    </div>
                </button>

                <!-- Jordan Taylor -->
                <button onclick="selectPersona('std_103')" id="btn-std_103" class="persona-btn text-left p-4 rounded-xl border border-slate-700/60 bg-slate-800/40 hover:bg-slate-800 transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-white group-hover:text-indigo-300">Jordan Taylor</span>
                        <span class="text-xs bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded font-mono">M.S. Data Sci</span>
                    </div>
                    <div class="text-xs text-slate-400 space-y-1">
                        <p><strong>GPA:</strong> 3.92 | <strong>Grad:</strong> 2026</p>
                        <p><strong>Skills:</strong> Python, PyTorch, NLP, Docker</p>
                        <p><strong>Interests:</strong> Research, AI/ML, NLP</p>
                    </div>
                </button>
            </div>
        </section>

        <!-- Category Filters & Status -->
        <section class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 font-medium mr-2">Filter Category:</span>
                <button onclick="filterCategory('all')" class="cat-filter active px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white">All</button>
                <button onclick="filterCategory('internship')" class="cat-filter px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Internships</button>
                <button onclick="filterCategory('scholarship')" class="cat-filter px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Scholarships</button>
                <button onclick="filterCategory('hackathon')" class="cat-filter px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Hackathons</button>
                <button onclick="filterCategory('research')" class="cat-filter px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Research</button>
            </div>

            <div class="text-xs text-slate-400">
                Showing <span id="opportunity-count" class="font-bold text-white">0</span> AI-ranked opportunities
            </div>
        </section>

        <!-- Opportunity Cards Feed -->
        <section id="feed-container" class="space-y-4">
            <!-- Opportunity Cards injected by JS -->
        </section>
    </main>

    <script>
        const datasets = {
            "std_101": {
                name: "Alex Chen",
                feed: [
                    {

                        org: "Google",
                        category: "internship",
                        score: 92.5,
                        fit: "Strong Match",
                        status: "ELIGIBLE",
                        location: "Mountain View, CA (Hybrid / Remote)",

                        gaps: [],
                        apply_url: "https://careers.google.com/jobs/results/sw-eng-intern-2027"
                    },
                    {

                        highlights: ["Category 'Hackathon' matches student preferences", "Matches 3 tech stack skills: Python, React, FastAPI", "Remote-friendly event"],
                        gaps: [],
                        apply_url: "https://devpost.com/hackathons/global-agentic-ai-2026"
                    },
                    {
                        title: "Generative AI Pioneers Student Scholarship",
                        org: "Generative AI Foundation",
                        category: "scholarship",
                        score: 78.5,
                        fit: "Good Match",
                        status: "ELIGIBLE",
                        location: "Remote / Global",
                        deadline: "November 30, 2026",
                        min_gpa: "3.0",
                        summary: "$10,000 grant towards academic tuition + 1-on-1 mentorship from leading AI researchers.",
                        highlights: ["Aligns with AI/ML interests", "Satisfies GPA requirement (3.85 >= 3.0)", "Remote-friendly award"],
                        gaps: [],
                        apply_url: "https://genai-foundation.org/scholarships/2026"
                    },
                    {
                        title: "Quantitative Software Engineer Intern",
                        org: "Jane Street",
                        category: "internship",
                        score: 71.0,
                        fit: "Good Match",
                        status: "ELIGIBLE",
                        location: "New York, NY",
                        deadline: "October 1, 2026",
                        min_gpa: "3.75",
                        summary: "Build high-frequency trading engines and low-latency systems.",
                        highlights: ["GPA requirement satisfied (3.85 >= 3.75)", "Graduation year 2027 matches target batch"],
                        gaps: ["Requires deeper C++ / Systems background"],
                        apply_url: "https://janestreet.com/join-jane-street"
                    },
                    {
                        title: "AI Research Assistant (NLP & Vision)",
                        org: "MIT CSAIL Lab",
                        category: "research",
                        score: 64.0,
                        fit: "Partial Match",
                        status: "ELIGIBLE",
                        location: "Cambridge, MA",
                        deadline: "December 1, 2026",
                        min_gpa: "3.7",
                        summary: "Research assistant position working on multi-modal LLM alignment and agent reasoning.",
                        highlights: ["Satisfies GPA requirement (3.85 >= 3.7)", "Matches PyTorch skill requirement"],
                        gaps: ["Targeted primarily at Graduate / M.S. students"],
                        apply_url: "https://csail.mit.edu/opportunities"
                    }
                ]
            },
            "std_102": {
                name: "Maya Patel",
                feed: [
                    {
                        title: "Quantitative Software Engineer Intern",
                        org: "Jane Street",
                        category: "internship",
                        score: 65.5,
                        fit: "Good Match",
                        status: "ELIGIBLE",
                        location: "New York, NY",
                        deadline: "October 1, 2026",
                        min_gpa: "3.75",
                        summary: "Build high-frequency trading engines and low-latency systems.",
                        highlights: ["Matches C++ and Linux core requirements", "Graduation year 2026 aligns with batch"],
                        gaps: ["GPA restriction warning (Student GPA 3.4 vs 3.75 required)"],
                        apply_url: "https://janestreet.com/join-jane-street"
                    },
                    {
                        title: "Global Agentic AI Hackathon 2026",
                        org: "Agentic AI Labs",
                        category: "hackathon",
                        score: 54.0,
                        fit: "Partial Match",
                        status: "ELIGIBLE",
                        location: "Remote",
                        deadline: "October 28, 2026",
                        min_gpa: "None",
                        summary: "Build autonomous software agents in a 3-day virtual hackathon.",
                        highlights: ["Matches Python skill", "Remote-friendly event"],
                        gaps: [],
                        apply_url: "https://devpost.com/hackathons"
                    },
                    {
                        title: "Software Engineering Intern, Summer 2027",
                        org: "Google",
                        category: "internship",
                        score: 35.0,
                        fit: "Ineligible",
                        status: "INELIGIBLE/GAP",
                        location: "Mountain View, CA",
                        deadline: "October 15, 2026",
                        min_gpa: "3.5",
                        summary: "Google software engineering internship.",
                        highlights: [],
                        gaps: ["GPA restriction: Required minimum is 3.5, but student GPA is 3.4", "Graduation year mismatch (targets 2027/2028, student graduates 2026)"],
                        apply_url: "https://careers.google.com"
                    }
                ]
            },
            "std_103": {
                name: "Jordan Taylor",
                feed: [
                    {
                        title: "AI Research Assistant (NLP & Vision)",
                        org: "MIT CSAIL Lab",
                        category: "research",
                        score: 95.0,
                        fit: "Strong Match",
                        status: "ELIGIBLE",
                        location: "Cambridge, MA",
                        deadline: "December 1, 2026",
                        min_gpa: "3.7",
                        summary: "Research assistant position working on multi-modal LLM alignment.",
                        highlights: ["Category 'Research' matches student preference", "Degree level M.S. matches requirement", "Matches 3 key skills: PyTorch, NLP, Python", "Strong GPA (3.92 >= 3.7)"],
                        gaps: [],
                        apply_url: "https://csail.mit.edu/opportunities"
                    },
                    {
                        title: "Generative AI Pioneers Student Scholarship",
                        org: "Generative AI Foundation",
                        category: "scholarship",
                        score: 91.0,
                        fit: "Strong Match",
                        status: "ELIGIBLE",
                        location: "Remote / Global",
                        deadline: "November 30, 2026",
                        min_gpa: "3.0",
                        summary: "$10,000 grant towards academic tuition.",
                        highlights: ["Strong alignment with NLP & AI/ML research", "Open to international/F-1 OPT students", "Satisfies GPA requirement"],
                        gaps: [],
                        apply_url: "https://genai-foundation.org"
                    }
                ]
            }
        };

        let currentPersona = "std_101";
        let currentFilter = "all";

        function selectPersona(personaId) {
            currentPersona = personaId;
            document.querySelectorAll('.persona-btn').forEach(btn => {
                btn.classList.remove('border-indigo-500/50', 'bg-indigo-500/10');
                btn.classList.add('border-slate-700/60', 'bg-slate-800/40');
            });
            const selectedBtn = document.getElementById(`btn-${personaId}`);
            selectedBtn.classList.remove('border-slate-700/60', 'bg-slate-800/40');
            selectedBtn.classList.add('border-indigo-500/50', 'bg-indigo-500/10');

            renderFeed();
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-filter').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            event.target.classList.add('bg-indigo-600', 'text-white');

            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            const data = datasets[currentPersona];
            let items = data.feed;

            if (currentFilter !== 'all') {
                items = items.filter(item => item.category === currentFilter);
            }

            document.getElementById('opportunity-count').innerText = items.length;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-800/30 rounded-xl border border-slate-800">
                        <p class="text-slate-400 text-sm">No opportunities match the selected category filter.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map((item, idx) => {
                let badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                if (item.fit === "Good Match") badgeColor = "bg-indigo-500/10 text-indigo-400 border-indigo-500/20";
                if (item.fit === "Partial Match") badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                if (item.fit === "Ineligible") badgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";

                const categoryColors = {
                    "internship": "bg-blue-500/20 text-blue-300",
                    "scholarship": "bg-purple-500/20 text-purple-300",
                    "hackathon": "bg-amber-500/20 text-amber-300",
                    "research": "bg-cyan-500/20 text-cyan-300"
                };

                return `
                    <div class="bg-slate-800/40 hover:bg-slate-800/70 border border-slate-800 rounded-2xl p-6 transition duration-200 space-y-4">
                        <div class="flex flex-wrap items-start justify-between gap-4">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs uppercase tracking-wider font-semibold px-2.5 py-0.5 rounded-full ${categoryColors[item.category]}">
                                        ${item.category}
                                    </span>
                                    <span class="text-xs text-slate-400 font-mono">Rank #${idx + 1}</span>
                                </div>
                                <h3 class="text-lg font-bold text-white">${item.title}</h3>
                                <p class="text-sm text-slate-300 font-medium">${item.org} • <span class="text-slate-400">${item.location}</span></p>
                            </div>

                            <div class="text-right flex flex-col items-end">
                                <div class="text-2xl font-black text-white">${item.score}<span class="text-xs text-slate-400 font-normal">/100</span></div>
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badgeColor} mt-1">
                                    ${item.fit}
                                </span>
                            </div>
                        </div>

                        <p class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800/80">
                            ${item.summary}
                        </p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div class="space-y-1">
                                <span class="font-semibold text-emerald-400">Match Highlights:</span>
                                <ul class="list-disc list-inside text-slate-300 space-y-0.5">
                                    ${item.highlights.length ? item.highlights.map(h => `<li>${h}</li>`).join('') : '<li class="text-slate-500">None</li>'}
                                </ul>
                            </div>
                            
                            <div class="space-y-1">
                                <span class="font-semibold ${item.gaps.length ? 'text-amber-400' : 'text-slate-400'}">Eligibility Gaps / Notes:</span>
                                <ul class="list-disc list-inside text-slate-300 space-y-0.5">
                                    ${item.gaps.length ? item.gaps.map(g => `<li class="text-amber-300/90">${g}</li>`).join('') : '<li class="text-slate-500">No eligibility gaps detected</li>'}
                                </ul>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center justify-between pt-3 border-t border-slate-800/80 text-xs text-slate-400 gap-2">
                            <div>
                                <span><strong>Deadline:</strong> ${item.deadline}</span> • 
                                <span><strong>Min GPA:</strong> ${item.min_gpa}</span>
                            </div>
                            <a href="${item.apply_url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-1.5 rounded-lg transition shadow-sm">
                                Apply Now ↗
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initial Render
        renderFeed();
    </script>
</body>
</html>
